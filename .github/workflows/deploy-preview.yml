name: Deploy Preview

# Previews are built by Vercel Git integration (no VERCEL_TOKEN required).
#
# One-time Vercel setup:
#   Project → Settings → Git → connect kcdgujarat/kcdgujarat.com
#   Production Branch = `production`  (NOT `main`)
#   → pushes to `main` and PRs become Preview deployments automatically
#
# This workflow only waits for the Vercel GitHub check and smoke-tests the preview URL.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    name: Verify Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deployment check
        uses: actions/github-script@v7
        id: vercel
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });

              const vercel = statuses.find((s) =>
                /vercel/i.test(s.context) && /deployment/i.test(s.context),
              );

              if (vercel) {
                core.info(`Vercel status: ${vercel.context} → ${vercel.state} (${vercel.target_url ?? 'no url'})`);
                if (vercel.state === 'success') {
                  core.setOutput('url', vercel.target_url ?? '');
                  return;
                }
                if (vercel.state === 'failure' || vercel.state === 'error') {
                  core.setFailed(`Vercel deployment failed: ${vercel.description ?? vercel.context}`);
                  return;
                }
              } else {
                core.info('Waiting for Vercel GitHub deployment status…');
              }

              await new Promise((r) => setTimeout(r, 15000));
            }

            core.setFailed(
              'Timed out waiting for Vercel preview. Check: Project → Settings → Git is connected and Production Branch is `production`.',
            );

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.vercel.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
        with:
          script: |
            const body = `<!-- vercel-preview-comment -->
            **Vercel preview** · [Open deployment](${process.env.PREVIEW_URL})
            \n\nProduction requires manual approval via **Deploy Production** workflow.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes('vercel-preview-comment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Smoke check preview
        if: steps.vercel.outputs.url != ''
        run: |
          URL="${{ steps.vercel.outputs.url }}"
          for path in / /api/health; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$URL$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ] || [ "$code" = "304" ] || exit 1
          done
