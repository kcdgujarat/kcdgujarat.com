name: Deploy Production

# Manual production deploy — no VERCEL_TOKEN required.
#
# After GitHub environment approval, fast-forwards the `production` branch to
# match `main`. Vercel Git integration deploys `production` to kcdgujarat.com.
#
# One-time setup:
#   1. Vercel → Project → Settings → Git → Production Branch = `production`
#   2. GitHub → Settings → Environments → production → Required reviewers
#   3. Create the branch once: git push origin main:production
#   4. This workflow needs `contents: write` (uses GITHUB_TOKEN)

on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  production:
    name: Promote main → production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://kcdgujarat.com
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:refs/heads/production" --force-with-lease
          echo "→ Vercel will deploy the production branch to kcdgujarat.com"

      - name: Wait for Vercel production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });

              const vercel = statuses.find((s) =>
                /vercel/i.test(s.context) && /deployment/i.test(s.context),
              );

              if (vercel) {
                core.info(`Vercel status: ${vercel.context} → ${vercel.state}`);
                if (vercel.state === 'success') return;
                if (vercel.state === 'failure' || vercel.state === 'error') {
                  core.setFailed(`Vercel production deploy failed: ${vercel.description ?? ''}`);
                  return;
                }
              }

              await new Promise((r) => setTimeout(r, 15000));
            }

            core.warning('Timed out waiting for Vercel status — check the Vercel dashboard.');
