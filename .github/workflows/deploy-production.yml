name: Deploy Production

# Manual production deploy — no VERCEL_TOKEN required.
#
# After GitHub environment approval, fast-forwards the `production` branch to
# match `main`. Vercel Git integration deploys `production` to kcdgujarat.com.
#
# One-time setup:
#   1. Vercel → Project → Settings → Git → Production Branch = `production`
#   2. GitHub → Settings → Environments → production → Required reviewers
#   3. Create the branch once: git push origin main:production

on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  production:
    name: Promote main → production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://kcdgujarat.com
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:refs/heads/production" --force-with-lease
          echo "→ Vercel will deploy the production branch to kcdgujarat.com"
