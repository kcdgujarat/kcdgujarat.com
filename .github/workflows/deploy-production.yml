name: Deploy Production

on:
  # Auto-deploy on main is DISABLED to avoid premature publishing.
  # Re-enable by uncommenting the `push` trigger below.
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  production:
    name: Vercel production (kcdgujarat.com)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://kcdgujarat.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke check (with retry)
        run: |
          set -eo pipefail
          # Vercel promotion + DNS can take a moment after deploy. Retry up to 6x.
          fetch() {
            for i in 1 2 3 4 5 6; do
              code=$(curl -sL -o /dev/null -w "%{http_code}" "$1")
              [ "$code" = "200" ] || [ "$code" = "304" ] && { echo "$code"; return 0; }
              sleep 10
            done
            echo "$code"
            return 1
          }
          for path in / /speakers /schedule /sponsors /venue /cfp /api/health; do
            url="https://kcdgujarat.com$path"
            code=$(fetch "$url") || (echo "✗ smoke failed on $path (last code $code)" && exit 1)
            echo "GET $path -> $code"
          done
