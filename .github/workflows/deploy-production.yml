name: Deploy Production

# Promotes the latest successful Vercel deployment from `main` to production.
# Push to `main` → Vercel builds → run this workflow (with approval) to go live.
#
# Vercel (recommended): Git → Production Branch = `main`, and disable
# "Auto-assign Custom Production Domains" so builds stay STAGED until promote.
#
# GitHub secrets: VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID (team only)

on:
  workflow_dispatch:

concurrency:
  group: vercel-production-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote latest main deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://kcdgujarat.com
    steps:
      - name: Promote latest main deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail

          for name in VERCEL_TOKEN VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

          vercel_team_q() {
            local lead="$1"
            if [ -n "${VERCEL_ORG_ID:-}" ]; then
              printf '%steamId=%s' "$lead" "$VERCEL_ORG_ID"
            fi
          }

          api() {
            local out
            out=$(mktemp)
            local status
            status=$(curl -sS -o "$out" -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "$@") || {
              echo "::error::curl failed"
              exit 1
            }
            if [ "$status" -ge 400 ]; then
              echo "::error::Vercel API HTTP $status for $*"
              cat "$out"
              exit 1
            fi
            cat "$out"
            rm -f "$out"
          }

          echo "→ Latest READY deployment on branch main"
          list_json=$(
            api "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&branch=main&state=READY&limit=5$(vercel_team_q '&')"
          )

          deployment=$(echo "$list_json" | jq -r '.deployments[0].uid // empty')
          target=$(echo "$list_json" | jq -r '.deployments[0].target // empty')
          substate=$(echo "$list_json" | jq -r '.deployments[0].readySubstate // empty')
          project_name=$(echo "$list_json" | jq -r '.deployments[0].name // empty')

          if [ -z "$deployment" ]; then
            echo "::error::No READY deployment on main. Push to main and wait for the Vercel build to finish."
            exit 1
          fi

          echo "→ Deployment ${deployment} (target=${target:-preview}, substate=${substate:-n/a})"

          if [ "$substate" = "PROMOTED" ] && [ "$target" = "production" ]; then
            echo "✓ This deployment is already serving production traffic."
            exit 0
          fi

          if [ "$target" = "production" ]; then
            echo "→ Promoting staged production deployment (instant, no rebuild)"
            api -X POST \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${deployment}$(vercel_team_q '?')"
            echo "✓ Production domains now point to ${deployment}"
            exit 0
          fi

          echo "→ Main deploy is preview — creating production deployment from same build"
          promote_json=$(
            api -X POST \
              -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"${deployment}\",\"name\":\"${project_name}\",\"target\":\"production\",\"meta\":{\"action\":\"promote\"}}" \
              "https://api.vercel.com/v13/deployments$(vercel_team_q '?')"
          )
          new_id=$(echo "$promote_json" | jq -r '.id // .uid // empty')
          inspector=$(echo "$promote_json" | jq -r '.inspectorUrl // empty')
          echo "✓ Production deploy started${new_id:+ (${new_id})}${inspector:+ — ${inspector}}"
